<h2>Reset your Listy password</h2>
<p><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery">Open Listy to choose a new password</a></p>
<p>Or type this code in the app:</p>
<p style="font-size:28px;letter-spacing:4px;font-weight:bold">{{ .Token }}</p>
<p>It expires in one hour. If you did not ask to reset your password, you can ignore this email.</p>
